<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmashX Tournament Firestore v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK: Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap');
        :root { --primary: #00f2ff; --accent: #22c55e; --dark: #020617; --card: rgba(15, 23, 42, 0.7); }
        body { font-family: 'Kanit', sans-serif; background: radial-gradient(circle at top right, #0f172a, #020617); color: #f8fafc; margin: 0; min-height: 100vh; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .dot { width: 44px; height: 44px; border-radius: 12px; background: #1e293b; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; transition: 0.2s ease; position: relative; z-index: 5; }
        .dot.active { background: linear-gradient(135deg, var(--primary), #0066ff); border-color: var(--primary); color: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,242,255,0.4); }
        .line { position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #1e293b; z-index: 1; transform: translateY(-50%); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #toast { visibility: hidden; min-width: 250px; background: var(--accent); color: #000; text-align: center; border-radius: 12px; padding: 16px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; font-weight: bold; }
        #toast.show { visibility: visible; animation: slideUp 0.5s, slideDown 0.5s 2.5s; }
        @keyframes slideUp { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes slideDown { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div id="toast">อัปเดตข้อมูลสำเร็จ!</div>

<!-- LOGIN PAGE -->
<div id="loginPage" class="flex flex-col items-center justify-start min-h-screen p-6 pt-12">
    <div class="glass p-10 w-full max-w-md text-center border-t-4 border-cyan-500 mb-8">
        <h1 class="orbitron text-4xl font-black mb-2 italic text-white">SMASH<span class="text-cyan-400">X</span></h1>
        <p class="orbitron text-[10px] tracking-[0.3em] text-slate-400 mb-8">REAL-TIME DATA SYNC</p>
        <div class="space-y-4">
            <input type="text" id="u" placeholder="USERNAME" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <input type="password" id="p" placeholder="PASSWORD" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <button onclick="login()" class="w-full bg-cyan-500 text-black py-4 rounded-xl font-black orbitron">LOGIN</button>
        </div>
    </div>
    <div id="publicPots" class="w-full max-w-4xl space-y-6"></div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden min-h-screen flex flex-col">
    <header class="sticky top-0 z-[100] bg-slate-950/80 backdrop-blur-xl border-b border-white/5 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h2 class="orbitron font-black text-xl italic tracking-tighter text-white">SMASH<span class="text-cyan-400">X</span></h2>
            <div class="flex items-center gap-4">
                <span id="displayUser" class="text-[10px] orbitron text-slate-400 font-bold"></span>
                <button onclick="location.reload()" class="text-red-400 orbitron text-[10px] font-bold">LOGOUT</button>
            </div>
        </div>
        <div class="max-w-6xl mx-auto mt-4 flex gap-4 overflow-x-auto no-scrollbar" id="nav"></div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full p-6 pb-24">
        <!-- Admin: Add Players -->
        <div id="tabPlayers" class="hidden space-y-4 max-w-xl mx-auto">
            <div class="glass p-6 flex gap-3">
                <input type="text" id="newP" placeholder="พิมพ์ชื่อนักกีฬาที่นี่..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:border-cyan-500 outline-none">
                <button onclick="addP()" class="bg-cyan-500 text-black px-8 rounded-xl font-black">เพิ่ม</button>
            </div>
            <div id="listP" class="glass divide-y divide-white/5"></div>
        </div>

        <!-- Admin: Manage Judges -->
        <div id="tabJudges" class="hidden space-y-4 max-w-2xl mx-auto">
            <div class="glass p-6 grid grid-cols-1 md:grid-cols-3 gap-4 border-b-2 border-blue-500">
                <input type="text" id="newJU" placeholder="JUDGE ID" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white outline-none">
                <input type="text" id="newJP" placeholder="PASS" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white outline-none">
                <button onclick="addJ()" class="bg-blue-600 text-white rounded-xl font-bold">บันทึกกรรมการ</button>
            </div>
            <div id="listJ" class="grid grid-cols-1 gap-4"></div>
        </div>

        <!-- Judge: Assign Groups (รายชื่อที่ Admin เพิ่มจะมาโผล่ตรงนี้) -->
        <div id="tabGroups" class="hidden">
            <div id="groupGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
        
        <!-- Judge: Eval & Summary -->
        <div id="tabEval" class="hidden space-y-6">
            <div id="evalTabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
            <div id="evalList" class="flex flex-col gap-8 max-w-2xl mx-auto"></div>
        </div>
        <div id="tabSummary" class="hidden max-w-3xl mx-auto"><div id="rankCont" class="space-y-12"></div></div>
        
        <!-- Admin: Master Control -->
        <div id="tabAdminMaster" class="hidden max-w-5xl mx-auto space-y-10">
            <div class="flex justify-between items-center bg-blue-500/10 p-6 rounded-3xl border border-blue-500/20">
                <h2 class="orbitron text-2xl font-black">MASTER CONTROL</h2>
                <div class="flex gap-2 flex-wrap justify-end">
                    <button onclick="exportBackup()" class="bg-slate-700 text-white px-5 py-3 rounded-xl font-black text-xs">EXPORT JSON</button>
                    <button onclick="document.getElementById('importFile').click()" class="bg-yellow-500 text-black px-5 py-3 rounded-xl font-black text-xs">IMPORT JSON</button>
                    <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)">
                    <div class="flex gap-3">
                    <button onclick="recalculatePots(true)" class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-black">RECAL POT</button>
                    <button onclick="publishPots()" class="bg-green-500 text-white px-8 py-3 rounded-xl font-black">PUBLISH</button>
                </div>
                </div>
            </div>
            <div id="masterRankCont" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>
    </main>
</div>

<script>
// --- 1. FIREBASE CONFIG: Firestore Database กลาง ---
const firebaseConfig = {
  apiKey: "AIzaSyCqFKrmhAodsZ8wRXovnKtatLGKHvU6LEo",
  authDomain: "smashx-tour.firebaseapp.com",
  projectId: "smashx-tour",
  storageBucket: "smashx-tour.firebasestorage.app",
  messagingSenderId: "664144888956",
  appId: "1:664144888956:web:9284bd6b26f926359ef5f9",
  measurementId: "G-CTSJB5YPN9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDoc = db.collection('smashx').doc('main_state');

// --- 2. STATE ---
// Default state ใช้เฉพาะตอน document ยังไม่มีจริง ๆ เท่านั้น
const DEFAULT_STATE = {
    players: [],
    users: [{u:'admin', p:'1234', r:'admin'}],
    evals: {},
    judgeGroups: {},
    manualPots: {},
    isPublished: false
};

let state = { ...DEFAULT_STATE };
let curUser = null;
let curEvalG = 1;
let isInitialLoaded = false;
let lastSavedAt = 0;

function normalizeState(data = {}) {
    return {
        ...DEFAULT_STATE,
        ...data,
        players: Array.isArray(data.players) ? data.players : [],
        users: Array.isArray(data.users) && data.users.length ? data.users : DEFAULT_STATE.users,
        evals: data.evals || {},
        judgeGroups: data.judgeGroups || {},
        manualPots: data.manualPots || {},
        isPublished: !!data.isPublished
    };
}

// สร้าง backup ก่อน save ทุกครั้ง เพื่อ rollback ได้
async function backupCurrentState(action = 'manual_save') {
    if (!isInitialLoaded) return;
    try {
        await db.collection('smashx_backups').add({
            action,
            by: curUser ? curUser.u : 'unknown',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            state: JSON.parse(JSON.stringify(state))
        });
    } catch (error) {
        console.warn('Backup failed:', error);
    }
}

// Save แบบใหม่: ส่งเฉพาะ field ที่แก้ และ merge เข้า document เดิม
async function savePatch(patch, action = 'update') {
    if (!patch || typeof patch !== 'object') {
        alert('Save ถูกเรียกผิดรูปแบบ: ต้องส่งเฉพาะ field ที่ต้องการแก้');
        return;
    }

    try {
        await backupCurrentState(action);
        await stateDoc.set({
            ...patch,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: curUser ? curUser.u : 'unknown'
        }, { merge: true });
        renderPublicPots();
    } catch (error) {
        console.error('Save error:', error);
        alert('บันทึกข้อมูลไม่สำเร็จ กรุณาเช็ก Firestore Rules');
    }
}

// --- 3. CORE SYNC: โหลด/อัปเดตข้อมูลจาก Firestore แบบ Real-time ---
stateDoc.onSnapshot(async (snapshot) => {
    if (snapshot.exists) {
        state = normalizeState(snapshot.data());
    } else {
        await stateDoc.set({
            ...DEFAULT_STATE,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        state = normalizeState(DEFAULT_STATE);
    }

    isInitialLoaded = true;
    refreshActiveUI();
    renderPublicPots();
}, (error) => {
    console.error('Firestore sync error:', error);
    alert('เชื่อมต่อ Firestore ไม่ได้ กรุณาเช็ก Rules หรือ Firebase Config');
});

// --- 4. NAVIGATION & LOGIN ---
function login() {
    const userInput = document.getElementById('u').value.trim().toLowerCase();
    const passInput = document.getElementById('p').value.trim();
    const found = state.users.find(x => x.u.toLowerCase() === userInput && x.p === passInput);

    if (found) {
        curUser = found;
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('displayUser').innerText = `@${found.u}`;
        renderNav();
        go(curUser.r === 'admin' ? 'tabPlayers' : 'tabGroups');
    } else {
        alert('ID หรือ Password ผิด');
    }
}

function renderNav() {
    const nav = document.getElementById('nav');
    const items = curUser.r === 'admin' ? 
        [{id:'tabPlayers', n:'นักกีฬา', i:'fa-users'}, {id:'tabJudges', n:'กรรมการ', i:'fa-gavel'}, {id:'tabAdminMaster', n:'MASTER SWAP', i:'fa-shuffle'}] :
        [{id:'tabGroups', n:'แบ่งกลุ่ม', i:'fa-layer-group'}, {id:'tabEval', n:'ประเมิน', i:'fa-clipboard-check'}, {id:'tabSummary', n:'MY RANK', i:'fa-trophy'}];
    nav.innerHTML = items.map(i => `<button onclick="go('${i.id}')" id="btn-${i.id}" class="nav-item flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold opacity-40 transition-all text-white"><i class="fa-solid ${i.i}"></i>${i.n}</button>`).join('');
}

function go(id) {
    document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(b => b.classList.add('opacity-40'));
    const activeBtn = document.getElementById('btn-'+id);
    if(activeBtn) activeBtn.classList.remove('opacity-40');
    refreshActiveUI();
}

function refreshActiveUI() {
    const activeTab = document.querySelector('main > div:not(.hidden)');
    if (!activeTab) return;
    const id = activeTab.id;
    if(id === 'tabPlayers') renderPlayers();
    if(id === 'tabJudges') renderJudges();
    if(id === 'tabGroups') renderGroups();
    if(id === 'tabEval') renderEval();
    if(id === 'tabSummary') renderSummary();
    if(id === 'tabAdminMaster') renderMasterSummary();
    renderPublicPots();
}

// --- 5. ADMIN FUNCTIONS ---
function addP() {
    const input = document.getElementById('newP');
    const name = input.value.trim();
    if(!name) return;
    state.players.push({ id: Date.now(), name: name });
    savePatch({ players: state.players }, 'add_player'); // ส่งขึ้น Cloud
    input.value = '';
    confirmToast();
}

function delP(id) {
    if(confirm('ลบนักกีฬา?')) {
        state.players = state.players.filter(p => p.id !== id);
        savePatch({ players: state.players }, 'delete_player');
    }
}

function renderPlayers() {
    document.getElementById('listP').innerHTML = state.players.map(p => `
        <div class="p-4 px-6 flex justify-between items-center text-white">
            <span>${p.name}</span>
            <button onclick="delP(${p.id})" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
        </div>
    `).join('');
}

function addJ() {
    const u = document.getElementById('newJU').value.trim();
    const p = document.getElementById('newJP').value.trim();
    if(!u || !p) return;
    state.users.push({ u, p, r: 'judge' });
    savePatch({ users: state.users }, 'add_judge');
    document.getElementById('newJU').value = '';
    document.getElementById('newJP').value = '';
}

function renderJudges() {
    document.getElementById('listJ').innerHTML = state.users.filter(x=>x.r==='judge').map(j => `
        <div class="glass p-5 flex justify-between items-center">
            <div><p class="text-white font-bold">${j.u}</p><p class="text-cyan-400 text-xs">PASS: ${j.p}</p></div>
            <button onclick="delJ('${j.u}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
        </div>
    `).join('');
}

function delJ(u) { if(confirm('ลบกรรมการ?')) { state.users = state.users.filter(x => x.u !== u); savePatch({ users: state.users }, 'delete_judge'); } }

// --- 6. JUDGE FUNCTIONS (ส่วนที่ทำให้เห็นชื่อข้ามเครื่อง) ---
const meta = {
    1: { n: 'ELITE', c: 'text-yellow-400', bc: 'border-yellow-400', b: 15, m: '🥇' },
    2: { n: 'PRO', c: 'text-zinc-300', bc: 'border-zinc-300', b: 10, m: '🥈' },
    3: { n: 'UPPER', c: 'text-orange-500', bc: 'border-orange-500', b: 5, m: '🥉' },
    4: { n: 'LOWER', c: 'text-slate-500', bc: 'border-slate-500', b: 0, m: '🎖️' }
};

function renderGroups() {
    const u = curUser.u;
    if(!state.judgeGroups[u]) state.judgeGroups[u] = {};
    
    // สำคัญ: ดึงรายชื่อที่ยังไม่ได้ถูกจัดกลุ่มใน 'เครื่องของกรรมการคนนี้'
    const waiting = state.players.filter(p => !state.judgeGroups[u][p.id]);

    let html = `<div class="lg:col-span-4 glass p-6 mb-4 text-center border-dashed border-2 border-white/10">
        <p class="text-xs orbitron text-slate-500 mb-3 uppercase">นักกีฬารอจัดกลุ่ม</p>
        <div class="flex flex-wrap justify-center gap-2">
            ${waiting.length > 0 ? waiting.map(p => `<span class="bg-cyan-500/10 text-cyan-400 px-4 py-1.5 rounded-xl text-xs font-bold border border-cyan-500/20">${p.name}</span>`).join('') : '<span class="text-slate-700">ไม่มีข้อมูล</span>'}
        </div>
    </div>`;

    [1,2,3,4].forEach(g => {
        const pInG = state.players.filter(p => state.judgeGroups[u][p.id] == g);
        html += `<div class="glass p-6 space-y-4 border-b-4 ${meta[g].bc}">
            <h4 class="${meta[g].c} orbitron font-black">${meta[g].m} ${meta[g].n}</h4>
            <select onchange="moveP(this.value, ${g})" class="w-full bg-slate-900 border border-white/5 p-3 rounded-xl text-xs text-white outline-none">
                <option value="">+ เพิ่มนักกีฬา</option>
                ${waiting.map(w => `<option value="${w.id}">${w.name}</option>`).join('')}
            </select>
            <div class="space-y-2">${pInG.map(p => `<div class="flex justify-between bg-white/5 p-3 rounded-xl text-xs"><span>${p.name}</span><button onclick="moveP(${p.id}, null)" class="text-red-400">✕</button></div>`).join('')}</div>
        </div>`;
    });
    document.getElementById('groupGrid').innerHTML = html;
}

function moveP(pid, gid) {
    if(!pid) return;
    if(!state.judgeGroups[curUser.u]) state.judgeGroups[curUser.u] = {};
    if(gid) state.judgeGroups[curUser.u][pid] = gid;
    else delete state.judgeGroups[curUser.u][pid];
    state.manualPots = calculateAutoPots();
    savePatch({ judgeGroups: state.judgeGroups, manualPots: state.manualPots }, 'move_player_group_and_recalculate_pots');
}

// ... (ฟังก์ชัน Eval, Summary, Master เหมือนเดิมเพื่อความเสถียร)
const skills = [
    {id:'move', n:'Footwork', icon:'fa-shoe-prints'}, {id:'power', n:'Power', icon:'fa-bolt-lightning'},
    {id:'smash', n:'Smash', icon:'fa-fire'}, {id:'place', n:'Control', icon:'fa-crosshairs'},
    {id:'def', n:'Defense', icon:'fa-shield-halved'}, {id:'tech', n:'Tactics', icon:'fa-brain'}
];

function renderEval() {
    const tabs = document.getElementById('evalTabs');
    tabs.innerHTML = [1,2,3,4].map(g => `<button onclick="curEvalG=${g}; renderEval();" class="flex-1 p-3.5 rounded-2xl border-2 orbitron text-[11px] font-black ${curEvalG===g ? 'bg-cyan-500 border-cyan-500 text-black':'bg-slate-900 border-white/5 text-slate-500'}">${meta[g].n}</button>`).join('');
    const players = state.players.filter(p => state.judgeGroups[curUser.u] && state.judgeGroups[curUser.u][p.id] == curEvalG);
    document.getElementById('evalList').innerHTML = players.map(p => {
        const sc = (state.evals[curUser.u] && state.evals[curUser.u][p.id]) ? state.evals[curUser.u][p.id] : {};
        return `<div class="glass p-8 space-y-8 border-l-4 ${meta[curEvalG].bc}">
            <h4 class="text-2xl font-black text-white">${p.name}</h4>
            <div class="grid gap-8">${skills.map(s => `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-400 orbitron uppercase">${s.n}</span>
                        <span class="orbitron text-2xl font-black text-cyan-400">${sc[s.id]||0}</span>
                    </div>
                    <div class="flex justify-between relative px-2">
                        <div class="line"></div>
                        ${[1,2,3,4,5].map(v => `<div onclick="setScore(${p.id},'${s.id}',${v})" class="dot ${sc[s.id]==v?'active':''}">${v}</div>`).join('')}
                    </div>
                </div>`).join('')}
            </div>
        </div>`;
    }).join('');
}

function setScore(pid, sid, v) {
    if(!state.evals[curUser.u]) state.evals[curUser.u] = {};
    if(!state.evals[curUser.u][pid]) state.evals[curUser.u][pid] = {};
    state.evals[curUser.u][pid][sid] = v;
    state.manualPots = calculateAutoPots();
    savePatch({ evals: state.evals, manualPots: state.manualPots }, 'set_score_and_recalculate_pots');
}

function renderSummary() {
    const u = curUser.u;
    let html = `<h2 class="text-center orbitron text-3xl font-black text-white mb-8 uppercase">${u} RANKING</h2>`;
    [1,2,3,4].forEach(g => {
        const players = state.players.filter(p => state.judgeGroups[u] && state.judgeGroups[u][p.id] == g);
        const ranked = players.map(p => {
            const sc = (state.evals[u] && state.evals[u][p.id]) ? state.evals[u][p.id] : {};
            const total = Object.values(sc).reduce((a,b)=>a+b, 0);
            return { ...p, score: total > 0 ? total + meta[g].b : 0 };
        }).sort((a,b) => b.score - a.score);
        if(ranked.length) html += `<div class="mb-8"><p class="${meta[g].c} font-bold mb-4">${meta[g].n}</p><div class="grid gap-2">${ranked.map(p => `<div class="glass p-4 flex justify-between"><span>${p.name}</span><span class="font-bold">${p.score}</span></div>`).join('')}</div></div>`;
    });
    document.getElementById('rankCont').innerHTML = html;
}

function buildMasterData() {
    const judges = state.users.filter(x => x.r === 'judge');
    return state.players.map(p => {
        let s = 0, c = 0;
        judges.forEach(j => {
            if(state.evals[j.u] && state.evals[j.u][p.id]) {
                const tot = Object.values(state.evals[j.u][p.id]).reduce((a,b)=>a+b, 0);
                if(tot > 0) {
                    const groupBase = meta[(state.judgeGroups[j.u] && state.judgeGroups[j.u][p.id]) || 4].b;
                    s += (tot + groupBase);
                    c++;
                }
            }
        });
        return { ...p, avg: c>0 ? s/c : 0, judgeCount: c };
    });
}

function calculateAutoPots() {
    const ranked = buildMasterData()
        .slice()
        .sort((a,b) => (b.avg - a.avg) || String(a.name).localeCompare(String(b.name)));

    const pots = {};
    const cut = Math.ceil(ranked.length / 2);
    ranked.forEach((p, i) => {
        pots[p.id] = i < cut ? 'upper' : 'lower';
    });
    return pots;
}

function recalculatePots(showMessage = false) {
    state.manualPots = calculateAutoPots();
    savePatch({ manualPots: state.manualPots }, 'recalculate_pots');
    renderMasterSummary();
    renderPublicPots();
    if(showMessage) confirmToast();
}

function renderMasterSummary() {
    let mData = buildMasterData();
    // ถ้ามีผู้เล่นใหม่หรือยังไม่มี pot ให้เติม pot อัตโนมัติทันที
    const hasMissingPot = state.players.some(p => !state.manualPots[p.id]);
    if((Object.keys(state.manualPots).length === 0 || hasMissingPot) && mData.length > 0) {
        state.manualPots = calculateAutoPots();
    }
    const renderP = (title, type, target) => `
        <div class="glass p-6">
            <h3 class="text-center font-black mb-4">${title}</h3>
            <div class="space-y-2">${mData.filter(p=>state.manualPots[p.id]===type).map(p=>`
                <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-xs">
                    <span>${p.name} (AVG: ${p.avg.toFixed(1)})</span>
                    <button onclick="swapP(${p.id},'${target}')" class="p-2 bg-white/5 rounded-lg"><i class="fa-solid fa-sync"></i></button>
                </div>`).join('')}
            </div>
        </div>`;
    document.getElementById('masterRankCont').innerHTML = renderP('UPPER POT','upper','lower') + renderP('LOWER POT','lower','upper');
}

function swapP(id, t) { state.manualPots[id] = t; savePatch({ manualPots: state.manualPots }, 'swap_pot'); }
function publishPots() { state.isPublished = true; savePatch({ isPublished: true, manualPots: state.manualPots }, 'publish_pots'); confirmToast(); }
function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `smashx-backup-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importBackup(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const imported = normalizeState(JSON.parse(e.target.result));
            if(!confirm('ยืนยัน Import Backup? ข้อมูลปัจจุบันจะถูกแทนที่ด้วยไฟล์นี้')) return;
            await backupCurrentState('before_import_backup');
            state = imported;
            await stateDoc.set({
                ...state,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedBy: curUser ? curUser.u : 'unknown',
                restoredAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            confirmToast();
        } catch (error) {
            console.error('Import error:', error);
            alert('ไฟล์ Backup ไม่ถูกต้อง');
        } finally {
            event.target.value = '';
        }
    };
    reader.readAsText(file);
}

function renderPublicPots() {
    if(!state.isPublished) { document.getElementById('publicPots').innerHTML = "<p class='text-center opacity-30 orbitron'>WAITING FOR RESULTS</p>"; return; }
    const res = (type) => state.players.filter(p=>state.manualPots[p.id]===type).map(p=>`<p class='bg-white/5 p-3 rounded-xl text-center mb-2 font-bold'>${p.name}</p>`).join('');
    document.getElementById('publicPots').innerHTML = `<div class='grid grid-cols-2 gap-4'><div class='glass p-6'><h4 class='text-cyan-400 text-center mb-4'>UPPER</h4>${res('upper')}</div><div class='glass p-6'><h4 class='text-purple-400 text-center mb-4'>LOWER</h4>${res('lower')}</div></div>`;
}
function confirmToast() { const t=document.getElementById('toast'); t.className='show'; setTimeout(()=>t.className='',2000); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmashX Tournament Optimized</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap');
    :root { --primary:#00f2ff; --accent:#22c55e; --dark:#020617; --card:rgba(15,23,42,.7); }
    body { font-family:'Kanit',sans-serif; background:radial-gradient(circle at top right,#0f172a,#020617); color:#f8fafc; margin:0; min-height:100vh; }
    .orbitron { font-family:'Orbitron',sans-serif; }
    .glass { background:var(--card); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.1); border-radius:1.5rem; }
    .dot { width:42px; height:42px; border-radius:12px; background:#1e293b; border:2px solid #334155; display:flex; align-items:center; justify-content:center; font-weight:800; cursor:pointer; transition:.15s ease; position:relative; z-index:5; }
    .dot.active { background:linear-gradient(135deg,var(--primary),#0066ff); border-color:var(--primary); color:#fff; transform:translateY(-3px); box-shadow:0 5px 15px rgba(0,242,255,.4); }
    .line { position:absolute; top:50%; left:0; width:100%; height:4px; background:#1e293b; z-index:1; transform:translateY(-50%); border-radius:10px; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    #toast { visibility:hidden; min-width:260px; background:var(--accent); color:#000; text-align:center; border-radius:12px; padding:14px 16px; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; font-weight:800; }
    #toast.show { visibility:visible; }
    .saving-pill { font-size:10px; border:1px solid rgba(255,255,255,.1); padding:4px 10px; border-radius:999px; color:#94a3b8; }
  </style>
</head>
<body>
<div id="toast">บันทึกสำเร็จ</div>

<div id="loginPage" class="flex flex-col items-center justify-start min-h-screen p-6 pt-12">
  <div class="glass p-10 w-full max-w-md text-center border-t-4 border-cyan-500 mb-8">
    <h1 class="orbitron text-4xl font-black mb-2 italic text-white">SMASH<span class="text-cyan-400">X</span></h1>
    <p class="orbitron text-[10px] tracking-[0.3em] text-slate-400 mb-8">OPTIMIZED REAL-TIME SYNC</p>
    <div class="space-y-4">
      <input type="text" id="u" placeholder="USERNAME" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
      <input type="password" id="p" placeholder="PASSWORD" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
      <button onclick="login()" class="w-full bg-cyan-500 text-black py-4 rounded-xl font-black orbitron">LOGIN</button>
    </div>
  </div>
  <div id="publicPots" class="w-full max-w-4xl space-y-6"></div>
</div>

<div id="app" class="hidden min-h-screen flex flex-col">
  <header class="sticky top-0 z-[100] bg-slate-950/80 backdrop-blur-xl border-b border-white/5 px-6 py-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center gap-4">
      <h2 class="orbitron font-black text-xl italic tracking-tighter text-white">SMASH<span class="text-cyan-400">X</span></h2>
      <div class="flex items-center gap-3">
        <span id="saveStatus" class="saving-pill">SYNC READY</span>
        <span id="displayUser" class="text-[10px] orbitron text-slate-400 font-bold"></span>
        <button onclick="location.reload()" class="text-red-400 orbitron text-[10px] font-bold">LOGOUT</button>
      </div>
    </div>
    <div class="max-w-6xl mx-auto mt-4 flex gap-4 overflow-x-auto no-scrollbar" id="nav"></div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full p-6 pb-24">
    <div id="tabPlayers" class="hidden space-y-4 max-w-xl mx-auto">
      <div class="glass p-6 flex gap-3">
        <input type="text" id="newP" placeholder="พิมพ์ชื่อนักกีฬาที่นี่..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:border-cyan-500 outline-none">
        <button onclick="addP()" class="bg-cyan-500 text-black px-8 rounded-xl font-black">เพิ่ม</button>
      </div>
      <div id="listP" class="glass divide-y divide-white/5"></div>
    </div>

    <div id="tabJudges" class="hidden space-y-4 max-w-2xl mx-auto">
      <div class="glass p-6 grid grid-cols-1 md:grid-cols-3 gap-4 border-b-2 border-blue-500">
        <input type="text" id="newJU" placeholder="JUDGE ID" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white outline-none">
        <input type="text" id="newJP" placeholder="PASS" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white outline-none">
        <button onclick="addJ()" class="bg-blue-600 text-white rounded-xl font-bold">บันทึกกรรมการ</button>
      </div>
      <div id="listJ" class="grid grid-cols-1 gap-4"></div>
    </div>

    <div id="tabGroups" class="hidden"><div id="groupGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div></div>
    <div id="tabEval" class="hidden space-y-6"><div id="evalTabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div><div id="evalList" class="flex flex-col gap-8 max-w-2xl mx-auto"></div></div>
    <div id="tabSummary" class="hidden max-w-3xl mx-auto"><div id="rankCont" class="space-y-12"></div></div>

    <div id="tabAdminMaster" class="hidden max-w-5xl mx-auto space-y-8">
      <div class="flex flex-col md:flex-row justify-between gap-4 items-center bg-blue-500/10 p-6 rounded-3xl border border-blue-500/20">
        <h2 class="orbitron text-2xl font-black">MASTER CONTROL</h2>
        <div class="flex flex-wrap gap-3 justify-center">
          <button onclick="recalPots(true)" class="bg-cyan-500 text-black px-5 py-3 rounded-xl font-black">RECAL POT</button>
          <button onclick="publishPots()" class="bg-green-500 text-white px-5 py-3 rounded-xl font-black">PUBLISH</button>
          <button onclick="exportJSON()" class="bg-slate-800 text-white px-5 py-3 rounded-xl font-black">EXPORT JSON</button>
          <label class="bg-slate-800 text-white px-5 py-3 rounded-xl font-black cursor-pointer">IMPORT JSON<input type="file" accept="application/json" onchange="importJSON(event)" class="hidden"></label>
        </div>
      </div>
      <div id="masterRankCont" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
  </main>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqFKrmhAodsZ8wRXovnKtatLGKHvU6LEo",
  authDomain: "smashx-tour.firebaseapp.com",
  projectId: "smashx-tour",
  storageBucket: "smashx-tour.firebasestorage.app",
  messagingSenderId: "664144888956",
  appId: "1:664144888956:web:9284bd6b26f926359ef5f9",
  measurementId: "G-CTSJB5YPN9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDoc = db.collection('smashx').doc('main_state');
const backupCol = db.collection('smashx_backups');

const defaultState = () => ({
  players: [],
  users: [{ u:'admin', p:'1234', r:'admin' }],
  evals: {},
  judgeGroups: {},
  manualPots: {},
  isPublished: false,
  updatedAt: null
});

let state = defaultState();
let curUser = null;
let curEvalG = 1;
let activeTabId = null;
let isApplyingRemote = false;
let pendingTimer = null;
let lastBackupAt = 0;
let lastRenderKey = '';

const meta = {
  1:{ n:'ELITE', c:'text-yellow-400', bc:'border-yellow-400', b:15, m:'🥇' },
  2:{ n:'PRO', c:'text-zinc-300', bc:'border-zinc-300', b:10, m:'🥈' },
  3:{ n:'UPPER', c:'text-orange-500', bc:'border-orange-500', b:5, m:'🥉' },
  4:{ n:'LOWER', c:'text-slate-500', bc:'border-slate-500', b:0, m:'🎖️' }
};
const skills = [
  {id:'move', n:'Footwork', icon:'fa-shoe-prints'},
  {id:'power', n:'Power', icon:'fa-bolt-lightning'},
  {id:'smash', n:'Smash', icon:'fa-fire'},
  {id:'place', n:'Control', icon:'fa-crosshairs'},
  {id:'def', n:'Defense', icon:'fa-shield-halved'},
  {id:'tech', n:'Tactics', icon:'fa-brain'}
];

function normalizeState(raw) {
  const base = defaultState();
  const s = { ...base, ...(raw || {}) };
  s.players = Array.isArray(s.players) ? s.players : [];
  s.users = Array.isArray(s.users) && s.users.length ? s.users : base.users;
  s.evals = s.evals || {};
  s.judgeGroups = s.judgeGroups || {};
  s.manualPots = s.manualPots || {};
  s.isPublished = !!s.isPublished;
  return s;
}

stateDoc.onSnapshot((snapshot) => {
  isApplyingRemote = true;
  if (snapshot.exists) {
    state = normalizeState(snapshot.data());
  } else {
    console.warn('main_state not found. Admin must initialize manually.');
    state = defaultState();
  }
  isApplyingRemote = false;
  renderCurrentOnly(true);
  renderPublicPots();
}, (error) => {
  console.error('Firestore sync error:', error);
  alert('เชื่อมต่อ Firestore ไม่ได้ กรุณาเช็ก Rules หรือ Firebase Config');
});

function setSaveStatus(text) {
  const el = document.getElementById('saveStatus');
  if (el) el.innerText = text;
}

async function backupIfNeeded(reason) {
  const now = Date.now();
  if (now - lastBackupAt < 5 * 60 * 1000 && reason !== 'manual') return;
  lastBackupAt = now;
  try {
    await backupCol.add({
      reason,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      state: JSON.parse(JSON.stringify(state))
    });
  } catch (err) {
    console.warn('Backup skipped/failed:', err);
  }
}

function queueSave(patch, options = {}) {
  if (isApplyingRemote) return;
  const { immediate = false, backup = false, message = 'บันทึกสำเร็จ' } = options;
  window.__pendingPatch = { ...(window.__pendingPatch || {}), ...patch };
  clearTimeout(pendingTimer);
  setSaveStatus('SAVING...');
  const delay = immediate ? 0 : 650;
  pendingTimer = setTimeout(() => flushSave({ backup, message }), delay);
}

async function flushSave(options = {}) {
  const patch = window.__pendingPatch;
  window.__pendingPatch = null;
  if (!patch) return;
  try {
    if (options.backup) await backupIfNeeded(options.message || 'save');
    await stateDoc.set({
      ...patch,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    setSaveStatus('SYNCED');
    confirmToast(options.message || 'บันทึกสำเร็จ');
  } catch (error) {
    console.error('Save error:', error);
    setSaveStatus('SAVE ERROR');
    alert('บันทึกข้อมูลไม่สำเร็จ กรุณาเช็ก Firestore Rules');
  }
}

function login() {
  const userInput = document.getElementById('u').value.trim().toLowerCase();
  const passInput = document.getElementById('p').value.trim();
  const found = state.users.find(x => String(x.u).toLowerCase() === userInput && x.p === passInput);
  if (!found) return alert('ID หรือ Password ผิด');
  curUser = found;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('displayUser').innerText = `@${found.u}`;
  renderNav();
  go(curUser.r === 'admin' ? 'tabPlayers' : 'tabGroups');
}

function renderNav() {
  const items = curUser.r === 'admin'
    ? [{id:'tabPlayers', n:'นักกีฬา', i:'fa-users'}, {id:'tabJudges', n:'กรรมการ', i:'fa-gavel'}, {id:'tabAdminMaster', n:'MASTER', i:'fa-shuffle'}]
    : [{id:'tabGroups', n:'แบ่งกลุ่ม', i:'fa-layer-group'}, {id:'tabEval', n:'ประเมิน', i:'fa-clipboard-check'}, {id:'tabSummary', n:'MY RANK', i:'fa-trophy'}];
  document.getElementById('nav').innerHTML = items.map(i => `<button onclick="go('${i.id}')" id="btn-${i.id}" class="nav-item flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold opacity-40 transition-all text-white"><i class="fa-solid ${i.i}"></i>${i.n}</button>`).join('');
}

function go(id) {
  activeTabId = id;
  lastRenderKey = '';
  document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.add('opacity-40'));
  const activeBtn = document.getElementById('btn-' + id);
  if (activeBtn) activeBtn.classList.remove('opacity-40');
  renderCurrentOnly(true);
}

function getRenderKey() {
  if (!activeTabId) return '';
  const light = {
    tabPlayers: [state.players],
    tabJudges: [state.users],
    tabGroups: [state.players, state.judgeGroups?.[curUser?.u]],
    tabEval: [state.players, state.judgeGroups?.[curUser?.u], state.evals?.[curUser?.u], curEvalG],
    tabSummary: [state.players, state.judgeGroups?.[curUser?.u], state.evals?.[curUser?.u]],
    tabAdminMaster: [state.players, state.users, state.judgeGroups, state.evals, state.manualPots]
  }[activeTabId];
  return activeTabId + ':' + JSON.stringify(light || []);
}

function renderCurrentOnly(force = false) {
  if (!activeTabId) return;
  const key = getRenderKey();
  if (!force && key === lastRenderKey) return;
  lastRenderKey = key;
  if (activeTabId === 'tabPlayers') renderPlayers();
  if (activeTabId === 'tabJudges') renderJudges();
  if (activeTabId === 'tabGroups') renderGroups();
  if (activeTabId === 'tabEval') renderEval();
  if (activeTabId === 'tabSummary') renderSummary();
  if (activeTabId === 'tabAdminMaster') renderMasterSummary();
}

function addP() {
  const input = document.getElementById('newP');
  const name = input.value.trim();
  if (!name) return;
  const player = { id: Date.now(), name };
  state.players = [...state.players, player];
  input.value = '';
  renderCurrentOnly(true);
  queueSave({ players: state.players }, { immediate:true, backup:true, message:'เพิ่มนักกีฬาแล้ว' });
}

function delP(id) {
  if (!confirm('ลบนักกีฬา?')) return;
  state.players = state.players.filter(p => p.id !== id);
  Object.keys(state.judgeGroups).forEach(u => { if (state.judgeGroups[u]) delete state.judgeGroups[u][id]; });
  Object.keys(state.evals).forEach(u => { if (state.evals[u]) delete state.evals[u][id]; });
  delete state.manualPots[id];
  renderCurrentOnly(true);
  queueSave({ players: state.players, judgeGroups: state.judgeGroups, evals: state.evals, manualPots: state.manualPots }, { immediate:true, backup:true, message:'ลบนักกีฬาแล้ว' });
}

function renderPlayers() {
  document.getElementById('listP').innerHTML = state.players.map(p => `
    <div class="p-4 px-6 flex justify-between items-center text-white">
      <span>${escapeHtml(p.name)}</span>
      <button onclick="delP(${p.id})" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
    </div>`).join('') || `<div class="p-6 text-center text-slate-500">ยังไม่มีนักกีฬา</div>`;
}

function addJ() {
  const u = document.getElementById('newJU').value.trim();
  const p = document.getElementById('newJP').value.trim();
  if (!u || !p) return;
  if (state.users.some(x => String(x.u).toLowerCase() === u.toLowerCase())) return alert('Judge ID นี้มีอยู่แล้ว');
  state.users = [...state.users, { u, p, r:'judge' }];
  document.getElementById('newJU').value = '';
  document.getElementById('newJP').value = '';
  renderCurrentOnly(true);
  queueSave({ users: state.users }, { immediate:true, backup:true, message:'เพิ่มกรรมการแล้ว' });
}

function delJ(u) {
  if (!confirm('ลบกรรมการ?')) return;
  state.users = state.users.filter(x => x.u !== u);
  delete state.judgeGroups[u];
  delete state.evals[u];
  renderCurrentOnly(true);
  queueSave({ users: state.users, judgeGroups: state.judgeGroups, evals: state.evals }, { immediate:true, backup:true, message:'ลบกรรมการแล้ว' });
}

function renderJudges() {
  const judges = state.users.filter(x => x.r === 'judge');
  document.getElementById('listJ').innerHTML = judges.map(j => `
    <div class="glass p-5 flex justify-between items-center">
      <div><p class="text-white font-bold">${escapeHtml(j.u)}</p><p class="text-cyan-400 text-xs">PASS: ${escapeHtml(j.p)}</p></div>
      <button onclick="delJ('${escapeAttr(j.u)}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
    </div>`).join('') || `<div class="glass p-6 text-center text-slate-500">ยังไม่มีกรรมการ</div>`;
}

function renderGroups() {
  const u = curUser.u;
  if (!state.judgeGroups[u]) state.judgeGroups[u] = {};

  // ใช้ player id เป็น string ให้ตรงกันทุกจุด ลดปัญหาชื่อค้างจาก key คนละ type
  const groupOf = (playerId) => state.judgeGroups[u][String(playerId)];
  const waiting = state.players.filter(p => !groupOf(p.id));

  let html = `<div class="lg:col-span-4 glass p-6 mb-4 text-center border-dashed border-2 border-white/10">
    <p class="text-xs orbitron text-slate-500 mb-3 uppercase">นักกีฬารอจัดกลุ่ม</p>
    <div class="flex flex-wrap justify-center gap-2">${waiting.length ? waiting.map(p => `<span class="bg-cyan-500/10 text-cyan-400 px-4 py-1.5 rounded-xl text-xs font-bold border border-cyan-500/20">${escapeHtml(p.name)}</span>`).join('') : '<span class="text-slate-700">ไม่มีข้อมูล</span>'}</div>
  </div>`;
  [1,2,3,4].forEach(g => {
    const pInG = state.players.filter(p => groupOf(p.id) == g);
    html += `<div class="glass p-6 space-y-4 border-b-4 ${meta[g].bc}">
      <h4 class="${meta[g].c} orbitron font-black">${meta[g].m} ${meta[g].n}</h4>
      <select onchange="moveP(this.value, ${g})" class="w-full bg-slate-900 border border-white/5 p-3 rounded-xl text-xs text-white outline-none">
        <option value="">+ เพิ่มนักกีฬา</option>${waiting.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}
      </select>
      <div class="space-y-2">${pInG.map(p => `<div class="flex justify-between bg-white/5 p-3 rounded-xl text-xs"><span>${escapeHtml(p.name)}</span><button onclick="moveP('${p.id}', null)" class="text-red-400">✕</button></div>`).join('')}</div>
    </div>`;
  });
  document.getElementById('groupGrid').innerHTML = html;
}

function moveP(pid, gid) {
  if (pid === null || pid === undefined || pid === '') return;

  const playerId = String(pid);
  const judgeId = curUser.u;
  if (!state.judgeGroups[judgeId]) state.judgeGroups[judgeId] = {};

  // clone object ก่อนแก้ เพื่อให้ render key เปลี่ยนแน่นอน ไม่ค้างจาก object เดิม
  state.judgeGroups = { ...state.judgeGroups, [judgeId]: { ...state.judgeGroups[judgeId] } };

  if (gid) state.judgeGroups[judgeId][playerId] = gid;
  else delete state.judgeGroups[judgeId][playerId];

  lastRenderKey = '';
  renderCurrentOnly(true);
  queueSave({ judgeGroups: state.judgeGroups }, { immediate:true, backup:false, message:'บันทึกกลุ่มแล้ว' });
}

function renderEval() {
  document.getElementById('evalTabs').innerHTML = [1,2,3,4].map(g => `<button onclick="curEvalG=${g}; lastRenderKey=''; renderCurrentOnly(true);" class="flex-1 p-3.5 rounded-2xl border-2 orbitron text-[11px] font-black ${curEvalG===g ? 'bg-cyan-500 border-cyan-500 text-black':'bg-slate-900 border-white/5 text-slate-500'}">${meta[g].n}</button>`).join('');
  const players = state.players.filter(p => state.judgeGroups[curUser.u] && state.judgeGroups[curUser.u][String(p.id)] == curEvalG);
  document.getElementById('evalList').innerHTML = players.map(p => {
    const sc = (state.evals[curUser.u] && state.evals[curUser.u][p.id]) ? state.evals[curUser.u][p.id] : {};
    return `<div class="glass p-8 space-y-8 border-l-4 ${meta[curEvalG].bc}">
      <h4 class="text-2xl font-black text-white">${escapeHtml(p.name)}</h4>
      <div class="grid gap-8">${skills.map(s => `<div class="space-y-4">
        <div class="flex justify-between items-center"><span class="text-xs font-bold text-slate-400 orbitron uppercase">${s.n}</span><span class="orbitron text-2xl font-black text-cyan-400" id="score-${p.id}-${s.id}">${sc[s.id]||0}</span></div>
        <div class="flex justify-between relative px-2"><div class="line"></div>${[1,2,3,4,5].map(v => `<div onclick="setScore(${p.id},'${s.id}',${v})" data-score-dot="${p.id}-${s.id}" data-v="${v}" class="dot ${sc[s.id]==v?'active':''}">${v}</div>`).join('')}</div>
      </div>`).join('')}</div>
    </div>`;
  }).join('') || `<div class="glass p-6 text-center text-slate-500">ยังไม่มีนักกีฬาในโถนี้</div>`;
}

function setScore(pid, sid, v) {
  if (!state.evals[curUser.u]) state.evals[curUser.u] = {};
  if (!state.evals[curUser.u][pid]) state.evals[curUser.u][pid] = {};
  state.evals[curUser.u][pid][sid] = v;
  document.getElementById(`score-${pid}-${sid}`).innerText = v;
  document.querySelectorAll(`[data-score-dot="${pid}-${sid}"]`).forEach(el => el.classList.toggle('active', Number(el.dataset.v) === v));
  queueSave({ evals: state.evals }, { backup:false, message:'บันทึกคะแนนแล้ว' });
}

function calculatePlayerAverages() {
  const judges = state.users.filter(x => x.r === 'judge');
  return state.players.map(p => {
    let s = 0, c = 0;
    judges.forEach(j => {
      const ev = state.evals?.[j.u]?.[p.id];
      if (ev) {
        const tot = Object.values(ev).reduce((a,b)=>a+Number(b||0),0);
        if (tot > 0) {
          const group = state.judgeGroups?.[j.u]?.[String(p.id)] || 4;
          s += tot + meta[group].b;
          c++;
        }
      }
    });
    return { ...p, avg: c > 0 ? s / c : 0, count: c };
  });
}

function recalPots(saveNow = false) {
  const ranked = calculatePlayerAverages().sort((a,b)=>b.avg-a.avg || String(a.name).localeCompare(String(b.name),'th'));
  const next = {};
  ranked.forEach((p, i) => next[p.id] = i < Math.ceil(ranked.length / 2) ? 'upper' : 'lower');
  state.manualPots = next;
  renderCurrentOnly(true);
  if (saveNow) queueSave({ manualPots: state.manualPots }, { immediate:true, backup:true, message:'Recal Pot แล้ว' });
}

function renderSummary() {
  const u = curUser.u;
  let html = `<h2 class="text-center orbitron text-3xl font-black text-white mb-8 uppercase">${escapeHtml(u)} RANKING</h2>`;
  [1,2,3,4].forEach(g => {
    const players = state.players.filter(p => state.judgeGroups[u] && state.judgeGroups[u][String(p.id)] == g);
    const ranked = players.map(p => {
      const sc = state.evals?.[u]?.[p.id] || {};
      const total = Object.values(sc).reduce((a,b)=>a+Number(b||0),0);
      return { ...p, score: total > 0 ? total + meta[g].b : 0 };
    }).sort((a,b)=>b.score-a.score);
    if (ranked.length) html += `<div class="mb-8"><p class="${meta[g].c} font-bold mb-4">${meta[g].n}</p><div class="grid gap-2">${ranked.map(p => `<div class="glass p-4 flex justify-between"><span>${escapeHtml(p.name)}</span><span class="font-bold">${p.score}</span></div>`).join('')}</div></div>`;
  });
  document.getElementById('rankCont').innerHTML = html;
}

function renderMasterSummary() {
  const mData = calculatePlayerAverages();
  if (!Object.keys(state.manualPots || {}).length && mData.length) recalPots(false);
  const renderP = (title, type, target) => `<div class="glass p-6"><h3 class="text-center font-black mb-4">${title}</h3><div class="space-y-2">${mData.filter(p=>state.manualPots[p.id]===type).sort((a,b)=>b.avg-a.avg).map(p=>`<div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-xs"><span>${escapeHtml(p.name)} (AVG: ${p.avg.toFixed(1)} / ${p.count} judges)</span><button onclick="swapP(${p.id},'${target}')" class="p-2 bg-white/5 rounded-lg"><i class="fa-solid fa-sync"></i></button></div>`).join('') || `<div class="text-center text-slate-600 text-xs">ไม่มีข้อมูล</div>`}</div></div>`;
  document.getElementById('masterRankCont').innerHTML = renderP('UPPER POT','upper','lower') + renderP('LOWER POT','lower','upper');
}

function swapP(id, target) {
  state.manualPots[id] = target;
  renderCurrentOnly(true);
  queueSave({ manualPots: state.manualPots }, { immediate:true, backup:true, message:'สลับโถแล้ว' });
}

function publishPots() {
  if (!Object.keys(state.manualPots || {}).length) recalPots(false);
  state.isPublished = true;
  queueSave({ isPublished:true, manualPots: state.manualPots }, { immediate:true, backup:true, message:'Publish แล้ว' });
  renderPublicPots();
}

function renderPublicPots() {
  const el = document.getElementById('publicPots');
  if (!el) return;
  if (!state.isPublished) { el.innerHTML = "<p class='text-center opacity-30 orbitron'>WAITING FOR RESULTS</p>"; return; }
  const res = (type) => state.players.filter(p=>state.manualPots?.[p.id]===type).map(p=>`<p class='bg-white/5 p-3 rounded-xl text-center mb-2 font-bold'>${escapeHtml(p.name)}</p>`).join('') || `<p class='text-center text-slate-600'>-</p>`;
  el.innerHTML = `<div class='grid grid-cols-2 gap-4'><div class='glass p-6'><h4 class='text-cyan-400 text-center mb-4'>UPPER</h4>${res('upper')}</div><div class='glass p-6'><h4 class='text-purple-400 text-center mb-4'>LOWER</h4>${res('lower')}</div></div>`;
}

function exportJSON() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `smashx-backup-${new Date().toISOString().slice(0,19).replaceAll(':','-')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const imported = normalizeState(JSON.parse(reader.result));
      if (!confirm('Import JSON จะเขียนทับข้อมูลปัจจุบัน ต้องการทำต่อไหม?')) return;
      await backupIfNeeded('manual');
      state = imported;
      await stateDoc.set({ ...state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:false });
      renderCurrentOnly(true);
      confirmToast('Import สำเร็จ');
    } catch (e) { alert('ไฟล์ JSON ไม่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

function confirmToast(msg = 'บันทึกสำเร็จ') {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'show';
  setTimeout(() => t.className = '', 1600);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
</script>
